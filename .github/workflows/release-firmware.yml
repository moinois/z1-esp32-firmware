name: Create firmware release

run-name: >-
  ${{ inputs.dry_run && 'Dry run' || 'Release' }}
  v${{ inputs.version }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in SemVer format, without a leading v
        required: true
        type: string
      source_ref:
        description: Branch, tag, or commit to release
        required: true
        default: dev
        type: string
      dry_run:
        description: Build and verify artifacts without creating a GitHub Release
        required: true
        default: true
        type: boolean
      publish_stable_from_non_main:
        description: Mark a stable version from a non-main ref as a stable release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      encoded_version: ${{ steps.version.outputs.encoded }}
      prerelease: ${{ steps.policy.outputs.prerelease }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out requested source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Record immutable source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          semver = re.compile(
              r"^(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)"
              r"(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
              r"(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?"
              r"(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          )
          if not semver.fullmatch(version):
              print(
                  "::error::Version must be valid SemVer without a leading v "
                  "(for example 1.2.3 or 1.2.3-rc.1)",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Verify that the release tag is available
        shell: bash
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

      - name: Encode firmware version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION_CORE="${VERSION%%[-+]*}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_CORE"

          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))

          if (( MAJOR > 255 || MINOR > 255 || PATCH > 255 )); then
            echo "::error::Version components must fit in one byte"
            exit 1
          fi

          ENCODED=$(( (MAJOR << 16) | (MINOR << 8) | PATCH ))
          printf -v ENCODED_HEX '0x%08X' "$ENCODED"
          echo "encoded=$ENCODED_HEX" >> "$GITHUB_OUTPUT"

      - name: Determine GitHub release classification
        id: policy
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          FORCE_STABLE: ${{ inputs.publish_stable_from_non_main }}
        run: |
          set -euo pipefail

          VERSION_WITHOUT_BUILD="${VERSION%%+*}"
          PRERELEASE=false
          REASON="stable version from main"

          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            PRERELEASE=true
            REASON="SemVer prerelease identifier"
          elif [[ "$SOURCE_REF" != "main" && "$FORCE_STABLE" != "true" ]]; then
            PRERELEASE=true
            REASON="stable version requested from non-main source"
          elif [[ "$SOURCE_REF" != "main" ]]; then
            REASON="explicit stable-release override for non-main source"
          fi

          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "## Release policy"
            echo
            echo "- Source: \`$SOURCE_REF\`"
            echo "- Source commit: \`${{ steps.source.outputs.sha }}\`"
            echo "- Version: \`$VERSION\`"
            echo "- Prerelease: \`$PRERELEASE\` ($REASON)"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Test and generate code coverage
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out validated source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install coverage toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang llvm cmake ninja-build

      - name: Run host tests and generate coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/host_coverage.py
          python3 -m pytest tools/tests -q

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          summary = json.loads(
              Path("build/host-coverage/coverage/coverage-summary.json")
              .read_text(encoding="utf-8")
          )["data"][0]["totals"]
          print("## Portable firmware code coverage")
          print()
          print("| Measure | Covered |")
          print("|---|---:|")
          for name in ("lines", "regions", "functions", "branches"):
              print(f"| {name.title()} | {summary[name]['percent']:.2f}% |")
          PY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-v${{ inputs.version }}${{ inputs.dry_run && '-dry-run' || '' }}
          path: build/host-coverage/coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest release coverage branch
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail

          publish_dir="$RUNNER_TEMP/z1-coverage"
          cp -R build/host-coverage/coverage "$publish_dir"
          cd "$publish_dir"
          touch .nojekyll
          git init
          git checkout -b coverage
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Publish coverage for $RELEASE_TAG"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin coverage

  build:
    name: Build and verify release firmware
    needs: prepare
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.4.1

    steps:
      - name: Check out validated source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify ESP-IDF environment
        shell: bash
        run: |
          set -euo pipefail
          source /opt/esp/idf/export.sh
          idf.py --version
          python3 --version

      - name: Build and package live firmware
        shell: bash
        env:
          MAINBOARD_VERSION: ${{ needs.prepare.outputs.encoded_version }}
        run: |
          set -euo pipefail
          source /opt/esp/idf/export.sh
          python3 tools/build_firmware.py \
            --live \
            --release \
            --mainboard-version "$MAINBOARD_VERSION" \
            --build-dir build

      - name: Prepare and verify release assets
        shell: bash
        env:
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir -p dist
          APP_BIN="$(python3 -c 'import json; print(json.load(open("build/project_description.json"))["app_bin"])')"
          test -f "build/$APP_BIN"

          cp "build/$APP_BIN" "dist/z1-mainboard-${RELEASE_TAG}.bin"
          cp build/firmware.bin "dist/z1-firmware-${RELEASE_TAG}.bin"
          cp build/hardware-selection.json dist/hardware-selection.json
          (cd dist && sha256sum *.bin > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Upload verified firmware artifact
        uses: actions/upload-artifact@v5
        with:
          name: firmware-v${{ inputs.version }}${{ inputs.dry_run && '-dry-run' || '' }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Create GitHub Release
    if: ${{ !inputs.dry_run }}
    needs:
      - prepare
      - coverage
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download verified firmware artifact
        uses: actions/download-artifact@v5
        with:
          name: firmware-v${{ inputs.version }}
          path: dist

      - name: Create release at validated source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          release_args=(
            "$RELEASE_TAG"
            dist/*.bin
            dist/SHA256SUMS.txt
            dist/hardware-selection.json
            --repo "$GITHUB_REPOSITORY"
            --target "$SOURCE_SHA"
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi

          gh release create "${release_args[@]}"
