name: Release firmware

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.4.1

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          submodules: recursive

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Verify ESP-IDF environment
        shell: bash
        run: |
          set -euo pipefail

          source /opt/esp/idf/export.sh

          idf.py --version
          python3 --version

      - name: Encode release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Force decimal parsing so valid zero-padded components such as 08
          # are not interpreted as invalid Bash octal literals.
          MAJOR=$((10#$MAJOR))
          MINOR=$((10#$MINOR))
          PATCH=$((10#$PATCH))

          if (( MAJOR > 255 || MINOR > 255 || PATCH > 255 )); then
            echo "::error::Version components must fit in one byte"
            exit 1
          fi

          ENCODED=$(( (MAJOR << 16) | (MINOR << 8) | PATCH ))

          printf -v ENCODED_HEX '0x%08X' "$ENCODED"

          echo "plain=$VERSION" >> "$GITHUB_OUTPUT"
          echo "encoded=$ENCODED_HEX" >> "$GITHUB_OUTPUT"

      - name: Build and package live firmware
        shell: bash
        env:
          MAINBOARD_VERSION: ${{ steps.version.outputs.encoded }}
        run: |
          set -euo pipefail

          source /opt/esp/idf/export.sh

          python3 tools/build_firmware.py \
            --live \
            --release \
            --mainboard-version "$MAINBOARD_VERSION" \
            --build-dir build

      - name: Prepare release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p dist

          APP_BIN="$(python3 -c 'import json; print(json.load(open("build/project_description.json"))["app_bin"])')"
          test -f "build/$APP_BIN"

          cp "build/$APP_BIN" \
            "dist/z1-mainboard-${RELEASE_TAG}.bin"

          cp build/firmware.bin \
            "dist/z1-firmware-${RELEASE_TAG}.bin"

          cp build/hardware-selection.json \
            dist/hardware-selection.json

          sha256sum dist/*.bin > dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Attach files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.bin
            dist/SHA256SUMS.txt
            dist/hardware-selection.json
          fail_on_unmatched_files: true
