[pytest]
testpaths = tests/hardware tools/tests
python_files = test_*.py
addopts = -ra
timeout = 600
timeout_method = signal
markers =
    hardware: requires a physical Makera Z1 or attached test equipment
    readonly: observes hardware without intentionally changing persistent state
    mutating: changes recoverable device state and requires Z1_ALLOW_MUTATION=1
    destructive: may rewrite firmware or persistent data and requires Z1_ALLOW_DESTRUCTIVE=1
    usb: requires the native USB vendor interface
    tcp: requires the firmware TCP service
    udp: requires UDP discovery on the target network
    http: requires the firmware HTTP service
    sd: requires a declared mounted physical or mock SD volume
    diagnostics: requires a diagnostic serial port
    wifi: requires RF and optional test-network configuration
    camera: requires the camera module
    ble: requires a BLE scanner and the target radio
    can: requires a CAN fixture
    controller: requires the external controller board
    ota: exercises firmware update behavior
    requirement(id): associates a physical check with a normative requirement ID
